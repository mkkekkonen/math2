name: Push Frontend Image to GCP

run-name: ${{ github.actor }} is pushing the math2 frontend image to GCP - ${{ github.run_number }}

on:
  push:
    branches:
      - master
      - db-ssl
    paths:
      - "frontend/**"
      - ".github/workflows/**"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      gh-actions: ${{ steps.changes.outputs.gh-actions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            frontend:
              - "frontend/**"
            gh-actions:
              - ".github/workflows/**"
          base: ${{ github.event.before }}

  push-frontend:
    runs-on: ubuntu-latest
    environment: deploy
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.frontend == 'true' ||
      needs.detect-changes.outputs.gh-actions == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          version: "latest"
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-north1-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          docker build -t europe-north1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/mkkekkonen/math-frontend:latest ./frontend
          docker push europe-north1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/mkkekkonen/math-frontend:latest
